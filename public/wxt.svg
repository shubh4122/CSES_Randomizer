<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#202b3d"/>
            <stop offset="100%" stop-color="#0b1220"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5eead4"/>
            <stop offset="100%" stop-color="#22c55e"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="128" height="128" rx="28" fill="url(#bg)"/>

    <!-- CSES branding -->
    <text x="64" y="27"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="19"
          font-weight="800"
          letter-spacing="2"
          fill="#5eead4">CSES</text>

    <!-- Problem grid -->
    <g transform="translate(25 39)"
       fill="none" stroke="#64748b" stroke-width="3">
        <rect x="0" y="0" width="21" height="21" rx="5"/>
        <rect x="29" y="0" width="21" height="21" rx="5"/>
        <rect x="0" y="29" width="21" height="21" rx="5"/>
    </g>

    <!-- Selected problem -->
    <rect x="54" y="68" width="21" height="21"
          rx="5" fill="url(#accent)"/>

    <path d="M60 78 L64 82 L70 74"
          fill="none" stroke="#0b1220"
          stroke-width="2.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Randomization arrows -->
    <g fill="none" stroke="url(#accent)"
       stroke-width="4" stroke-linecap="round"
       stroke-linejoin="round">
        <path d="M55 46 C75 34 95 46 95 62"/>
        <path d="M86 56 L95 64 L102 54"/>

        <path d="M76 101 C56 113 36 101 36 85"/>
        <path d="M45 91 L36 83 L29 93"/>
    </g>

    <!-- Selection sparkle -->
    <path d="M92 80 L95 88 L103 91 L95 94 L92 102
           L89 94 L81 91 L89 88 Z"
          fill="#5eead4"/>
</svg>